<div
  class="relative flex items-center w-full h-[38px] bg-surface-0 border rounded-sm transition-all focus-within:border-primary-600 focus-within:ring-2 focus-within:ring-primary-100"
  [ngClass]="{
    'border-red-500 focus-within:ring-red-100': error,
    'border-surface-300': !error,
    'bg-surface-100 cursor-not-allowed': disabled
  }"
>
  <select
    [ngModel]="value"
    [disabled]="disabled"
    class="w-full h-full pl-3 pr-8 border-none bg-transparent text-[0.84rem] font-medium text-surface-900 outline-none rounded-sm appearance-none cursor-pointer disabled:cursor-not-allowed disabled:text-surface-500"
    (ngModelChange)="onValueChange($event)"
    (blur)="onBlur($event)"
  >
    @if (allowEmpty) {
      <option [ngValue]="null">{{ placeholder || emptyLabel || 'Select...' }}</option>
    }
    @if (options && options.length > 0) {
      @for (opt of options; track $index) {
        <option
          [ngValue]="getOptionValue(opt)"
          [disabled]="opt?.disabled"
        >
          {{ getOptionLabel(opt) }}
        </option>
      }
    }
    <ng-content></ng-content>
  </select>
  <i class="pi pi-chevron-down absolute right-3 text-surface-400 text-xs pointer-events-none"></i>
</div>
