@if (isOpen) {
  <div class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center z-[1000] p-5" (click)="onBackdropClick($event)">
    <div
      [class]="getDialogClasses()"
      (click)="$event.stopPropagation()"
    >
      <div class="px-6 py-4 border-b border-surface-200 flex items-center justify-between gap-3 bg-surface-0 shrink-0">
        <div>
          <h3 class="text-lg font-bold text-surface-900 m-0">{{ title }}</h3>
          @if (subtitle) {
            <p class="text-[0.8125rem] text-surface-500 mt-1 mb-0">{{ subtitle }}</p>
          }
        </div>
        <div class="flex items-center gap-2">
          <ng-content select="[header-actions]"></ng-content>
          @if (closable) {
            <button
              type="button"
              class="bg-transparent border-0 text-surface-400 hover:text-surface-700 hover:bg-surface-100 p-1.5 rounded-sm flex items-center justify-center cursor-pointer transition-all"
              (click)="handleClose()"
              title="Close (Esc)"
            >
              <i class="pi pi-times"></i>
            </button>
          }
        </div>
      </div>

      <div class="p-6 overflow-y-auto flex-1">
        <ng-content></ng-content>
      </div>

      <div class="px-6 py-3.5 border-t border-surface-200 bg-surface-50 flex items-center justify-end gap-3 shrink-0 empty:hidden">
        <ng-content select="[footer]"></ng-content>
      </div>
    </div>
  </div>
}
