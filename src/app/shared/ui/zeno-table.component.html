<div class="block w-full bg-surface-0 border border-surface-200 rounded-md shadow-xs overflow-hidden">
  @if (hasToolbar) {
    <div class="flex justify-between items-center px-5 py-3.5 gap-4 flex-wrap border-b border-surface-200 bg-surface-0">
      <div class="flex items-center gap-3 flex-wrap">
        <ng-content select="[toolbar-left]"></ng-content>
      </div>
      <div class="flex items-center gap-2.5 flex-wrap">
        <ng-content select="[toolbar-right]"></ng-content>
      </div>
    </div>
  }

  <div class="w-full overflow-x-auto overflow-y-hidden">
    <!-- Optional sortable column header row (when columns[] is provided) -->
    @if (columns && columns.length > 0) {
      <table class="w-full border-separate border-spacing-0 text-sm">
        <thead>
          <tr class="bg-surface-50">
            @for (col of columns; track col.key) {
              <th
                class="text-surface-600 font-semibold text-xs uppercase tracking-wider px-4 py-3 border-b border-surface-200 whitespace-nowrap"
                [ngClass]="{
                  'text-left':   col.align === 'left'   || !col.align,
                  'text-center': col.align === 'center',
                  'text-right':  col.align === 'right',
                  'cursor-pointer select-none hover:bg-surface-100 transition-colors': col.sortable
                }"
                [style.width]="col.width || 'auto'"
                (click)="onSortClick(col)"
              >
                <span class="inline-flex items-center gap-1.5">
                  {{ col.label }}
                  @if (col.sortable) {
                    <i [class]="getSortIcon(col)" class="text-[0.7rem]"></i>
                  }
                </span>
              </th>
            }
          </tr>
        </thead>
        <tbody>
          <ng-content></ng-content>
        </tbody>
      </table>
    } @else {
      <ng-content></ng-content>
    }

    @if (loading) {
      <div class="p-12 text-center flex flex-col items-center justify-center gap-3 text-surface-500 text-sm">
        <i class="pi pi-spin pi-spinner text-3xl text-primary-600"></i>
        <span>{{ loadingMessage }}</span>
      </div>
    } @else if (empty) {
      <div class="p-12 text-center flex flex-col items-center justify-center text-surface-500 text-sm">
        <div class="w-14 h-14 rounded-full bg-surface-100 flex items-center justify-center mb-3 text-surface-400 text-2xl">
          <i [class]="emptyIcon"></i>
        </div>
        <p class="text-[0.9375rem] font-medium text-surface-600 m-0">{{ emptyMessage }}</p>
        @if (emptyActionText) {
          <button
            type="button"
            class="inline-flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-700 active:translate-y-px text-white px-4 py-2 rounded-sm text-sm font-semibold transition-all shadow-xs cursor-pointer mt-3"
            (click)="emptyAction.emit()"
          >
            {{ emptyActionText }}
          </button>
        }
      </div>
    }
  </div>

  <div class="px-5 py-3 border-t border-surface-200 bg-surface-50 flex items-center justify-between empty:hidden">
    <ng-content select="[footer]"></ng-content>
  </div>
</div>
