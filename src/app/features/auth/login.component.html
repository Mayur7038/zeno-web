<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-200 p-6">
  <div class="w-full max-w-[440px]">
    <div class="text-center mb-6">
      <img src="/zeno-books-logo.png" alt="ZENO BOOKS" class="h-[82px] max-w-[320px] object-contain mx-auto mb-4 block" />
      <p class="text-[0.8125rem] text-surface-500 mt-1">Cloud ERP & Financial Accounting Platform</p>
    </div>

    <div class="bg-surface-0 border border-surface-200 rounded-2xl p-8 shadow-md">
      <h2 class="text-xl font-bold text-surface-900 m-0">Sign In to Your Workspace</h2>
      <p class="text-[0.8125rem] text-surface-500 mb-5 mt-1">Enter your credentials to access your tenant</p>

      @if (errorMessage) {
        <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-sm flex items-center gap-2 text-[0.8125rem] mb-4">
          <i class="pi pi-exclamation-circle text-red-600"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }



      <form (ngSubmit)="onLogin()">
        <div class="flex flex-col gap-1.5 mb-4">
          <label class="text-sm font-medium text-surface-700">Work Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="username"
            class="w-full px-3 py-2 border border-surface-200 rounded-sm text-sm text-surface-900 bg-surface-0 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-100 transition-all"
          />
        </div>

        <div class="flex flex-col gap-1.5 mb-4">
          <div class="flex justify-between items-center mb-0.5">
            <label class="text-sm font-medium text-surface-700">Password</label>
            <a routerLink="/auth/forgot-password" class="text-[0.8125rem] text-primary-600 hover:underline font-semibold">Forgot password?</a>
          </div>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
            class="w-full px-3 py-2 border border-surface-200 rounded-sm text-sm text-surface-900 bg-surface-0 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-100 transition-all"
          />
        </div>

        <button type="submit" class="w-full bg-primary-600 hover:not-disabled:bg-primary-700 text-white font-semibold text-[0.9375rem] py-3 rounded-sm cursor-pointer flex items-center justify-center gap-2 mt-2 transition-all shadow-xs hover:not-disabled:shadow-md disabled:opacity-60 disabled:cursor-not-allowed" [disabled]="loading">
          @if (loading) {
            <i class="pi pi-spin pi-spinner"></i> Authenticating...
          } @else {
            <i class="pi pi-sign-in"></i> Sign In
          }
        </button>
      </form>

      <div class="mt-6 text-center text-[0.8125rem] text-surface-500">
        <span>New business?</span>
        <a routerLink="/auth/signup" class="text-primary-600 hover:underline font-semibold ml-1.5">Create an account</a>
      </div>
    </div>
  </div>
</div>
